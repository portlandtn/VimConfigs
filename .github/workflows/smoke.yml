name: Portable Neovim startup
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim: [v0.11.3, stable]
    runs-on: ${{ matrix.os }}
    env:
      NVIM_APPNAME: vimconfigs-ci
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Verify installer backup and settings preservation
        run: nvim -l scripts/test-install.lua
      - name: Install without touching the default config
        run: nvim -l scripts/install.lua
      - name: Restore locked plugins
        run: nvim --headless "+Lazy! restore" +qa
      - name: Exercise startup, completion, file search and file tree
        run: nvim --headless "+lua dofile('scripts/smoke.lua')"
